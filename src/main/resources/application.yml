server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: jdbc:h2:file:./data/demo3-task-state;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

logging:
  level:
    com.example.demo3: INFO
